services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: dafl-jenkins:quick-setup
    container_name: dafl-jenkins
    user: root # Bắt buộc để dùng docker.sock
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../../:/var/repo/DAFL:ro
      - ./jenkins.yaml:/var/jenkins_home/casc.yaml:ro
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true -Dhudson.model.DirectoryBrowserSupport.CSP= -Xmx768m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8080/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
    restart: unless-stopped

volumes:
  jenkins_data:
    name: dafl_jenkins_data
