services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dafl-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../:/var/repo/DAFL:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true -Xmx1024m -Xms512m
    restart: unless-stopped

volumes:
  jenkins_data:
    name: dafl_jenkins_data
