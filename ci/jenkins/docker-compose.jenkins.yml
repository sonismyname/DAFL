services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: dafl-jenkins:custom
    container_name: dafl-jenkins
    user: root # Bắt buộc để dùng docker.sock
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../:/var/repo/DAFL:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true -Dhudson.model.DirectoryBrowserSupport.CSP= -Xmx768m -Xms256m
    deploy:
      resources:
        limits:
          memory: 1.5G
    restart: unless-stopped

volumes:
  jenkins_data:
    name: dafl_jenkins_data
