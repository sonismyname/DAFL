name: dafl

services:
  # 1. PostgreSQL 16 Alpine (Lightweight for demo, ~80MB vs 2GB+ SQL Server)
  postgres:
    image: postgres:16-alpine
    container_name: dafl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dafl_db}
      POSTGRES_USER: ${POSTGRES_USER:-dafl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dafl_password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dafl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dafl} -d $${POSTGRES_DB:-dafl_db} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  # 3. Apache Kafka 3.7+ in KRaft Mode (No Zookeeper required)
  kafka:
    image: apache/kafka:3.7.0
    container_name: dafl-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - dafl-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 4. Backend: .NET 8 Web API (Vertical Slice Architecture)
  backend:
    build:
      context: ./src/Backend
      dockerfile: Dockerfile
    container_name: dafl-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-dafl_db};Username=${POSTGRES_USER:-dafl};Password=${POSTGRES_PASSWORD:-dafl_password123};
      - CacheSettings__Enabled=false
      - KafkaSettings__BootstrapServers=kafka:9092
      - Frontend__BaseUrl=http://localhost:${FRONTEND_PORT:-3000}
      - PayOS__ClientId=${PAYOS_CLIENT_ID:-demo_client_id}
      - PayOS__ApiKey=${PAYOS_API_KEY:-demo_api_key}
      - PayOS__ChecksumKey=${PAYOS_CHECKSUM_KEY:-demo_checksum_key}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dafl-network

  # 5. Frontend: ReactJS + Vite (Served via Nginx Alpine)
  frontend:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
    container_name: dafl-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - dafl-network

networks:
  dafl-network:
    driver: bridge

volumes:
  postgres_data:
    name: dafl_postgres_data
